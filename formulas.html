<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Formulas · 104Lite</title><meta name="description" content="104Lite — compre prep for BITS U104 Foundations of Measurement: 10 timed mixed mocks and 27 topic quizzes with +3/−1 marking."/>
<link rel="icon" href="assets/logo.svg"/>
<script>try{var t=localStorage.getItem("lite104:theme");t=t?JSON.parse(t):(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");if(t==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<meta name="theme-color" content="#0a1120" media="(prefers-color-scheme: dark)"/><meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)"/>
<link rel="stylesheet" href="assets/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><script src="assets/js/tw.js"></script>
<style>html,body{margin:0}body{overscroll-behavior:none;font-family:Inter,system-ui,sans-serif}::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400;line-height:1}.fill{font-variation-settings:'FILL' 1}@media print{header,nav,.noprint{display:none!important}main{padding:0!important}}</style>
<script src="assets/js/topics.js"></script><script src="assets/js/bank.js"></script><script src="assets/js/app.js"></script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<main class="max-w-3xl mx-auto pt-16 pb-24">
<section class="sticky top-16 z-30 px-gutter-mobile pt-space-md pb-space-sm bg-surface/95 backdrop-blur-md">
  <h2 class="font-headline-sm text-headline-sm mb-space-sm">Formula Sheet</h2>
  <div class="relative flex items-center"><span class="absolute left-3.5 text-on-surface-variant material-symbols-outlined text-[20px]">search</span><input id="q" type="search" placeholder="Search: Cd, friability, γ, LOD…" class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-surface-container-low placeholder:text-outline font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-secondary/30 shadow-sm"></div>
</section>
<div id="list" class="stagger px-gutter-mobile flex flex-col gap-space-sm mt-space-sm"></div>
</main>
<script>
const { shell, esc } = ACE;
shell({ active: "formulas", title: "Formulas" });
list.innerHTML = TOPICS.map(t => `<section class="blk bg-surface-container-lowest rounded-xl p-space-md shadow-sm" data-s="${esc((t.name + t.f.flat().join(" ")).toLowerCase())}">
  <a href="topic.html?id=${t.id}" class="flex items-center gap-2 mb-2"><span class="material-symbols-outlined text-secondary text-[20px]">${t.icon}</span><h3 class="font-title-md text-title-md">${t.code} · ${esc(t.name)}</h3></a>
  <div class="grid sm:grid-cols-2 gap-2">${t.f.map(([k, v]) => `<div class="row rounded-lg bg-surface-container-low p-2.5" data-s="${esc((k + " " + v).toLowerCase())}"><p class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">${esc(k)}</p><p class="font-label-mono-md text-label-mono-md mt-0.5">${esc(v)}</p></div>`).join("")}</div></section>`).join("");
q.oninput = () => { const v = q.value.toLowerCase().trim(); document.querySelectorAll(".blk").forEach(b => { let any = false; b.querySelectorAll(".row").forEach(r => { const m = !v || r.dataset.s.includes(v) || b.dataset.s.startsWith(v); r.classList.toggle("hidden", !m); any = any || m; }); b.classList.toggle("hidden", !any); }); };
</script>
</body></html>
