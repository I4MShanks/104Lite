<body class="bg-surface text-on-surface antialiased min-h-screen">
<main class="max-w-3xl mx-auto pt-16 pb-28 px-gutter-mobile">
<section class="pt-space-md"><h2 class="font-headline-sm text-headline-sm">Mixed Mock Tests</h2><p class="font-body-sm text-body-sm text-on-surface-variant">20 questions · 30 minutes · 60 marks. Each mock: 4 from Lecture 1 + 2 from every experiment. Mostly numericals.</p></section>
<section id="chartWrap" class="hidden mt-space-md bg-surface-container-lowest rounded-xl p-space-md shadow-sm"><div class="flex items-center justify-between mb-2"><h3 class="font-title-md text-title-md">Your best scores</h3><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">out of 60</span></div><div id="chart" class="flex items-end gap-2 h-32"></div></section>
<div id="list" class="stagger flex flex-col gap-space-sm mt-space-md"></div>
<button id="reset" class="mt-space-lg mx-auto block font-label-mono-sm text-label-mono-sm text-on-surface-variant underline">Reset my scores</button>
</main>
<script>
const { shell, results, MOCKS, pad, toast } = ACE;
shell({ active: "mocks", title: "Mock Tests" });
const R = results();
if (MOCKS.some(m => R[m.id])) { chartWrap.classList.remove("hidden"); chart.innerHTML = MOCKS.map(m => { const r = R[m.id], v = r ? Math.max(0, r.best) : 0; return `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end"><span class="font-label-mono-sm text-[10px] text-on-surface-variant">${r ? r.best : ""}</span><div class="w-full rounded-t-md ${r ? (v >= 45 ? "bg-secondary" : v >= 30 ? "bg-tertiary-fixed-dim" : "bg-error") : "bg-surface-container"}" style="height:${r ? Math.max(4, v / 60 * 100) : 4}%;transition:height .8s cubic-bezier(.2,.7,.2,1)"></div><span class="font-label-mono-sm text-[10px] text-on-surface-variant">${pad(m.n)}</span></div>`; }).join(""); }
list.innerHTML = MOCKS.map(m => { const r = R[m.id];
  return `<a href="quiz.html?id=${m.id}" class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm hover:shadow-md flex items-center justify-between gap-3">
  <div class="flex items-center gap-3"><span class="w-11 h-11 rounded-xl ${r ? "bg-secondary text-on-secondary" : "bg-surface-container-high"} flex items-center justify-center font-label-mono-md text-label-mono-md font-bold">${pad(m.n)}</span>
  <div><p class="font-title-md text-title-md">Mixed Mock ${pad(m.n)}</p><p class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">${r ? `Last: ${r.last.marks}/60 · ✓${r.last.correct} ✗${r.last.wrong} — ${r.last.blank}` : "20 Qs · 30 min · +3/−1"}</p></div></div>
  ${r ? `<div class="text-right"><p class="font-headline-sm text-headline-sm">${r.best}<span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">/60</span></p><p class="font-label-mono-sm text-[10px] text-on-surface-variant">best of ${r.attempts}</p></div>` : `<span class="px-3.5 py-1.5 rounded-lg bg-primary text-on-primary font-label-mono-sm text-label-mono-sm font-semibold">Start</span>`}</a>`; }).join("");
reset.onclick = () => { if (confirm("Clear all mock and quiz scores for this account?")) { const pre = "lite104:u:" + ACE.auth.session().u + ":"; Object.keys(localStorage).filter(k => k.startsWith(pre)).forEach(k => localStorage.removeItem(k)); toast("Scores cleared"); setTimeout(() => location.reload(), 500); } };
</script>
</body></html>
