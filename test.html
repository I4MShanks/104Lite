<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Test · ACE104</title><meta name="description" content="ACE104 — lectures, podcasts, video overviews, lab manuals and tests for BITS U104 Foundations of Measurement & Experimentation."/>
<link rel="icon" href="assets/logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><script src="assets/js/tw.js"></script>
<style>html,body{margin:0}body{overscroll-behavior:none;font-family:Inter,system-ui,sans-serif}::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400;line-height:1}.fill{font-variation-settings:'FILL' 1}@media print{header,nav,.noprint{display:none!important}main{padding:0!important}}</style>
<script src="assets/js/lectures.js"></script><script src="assets/js/questions.js"></script><script src="assets/js/media.js"></script><script src="assets/js/app.js"></script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<main class="max-w-3xl mx-auto pt-16 pb-10"><div id="app" class="flex flex-col px-gutter-mobile gap-space-md pt-space-sm"></div></main>
<!-- Formula sheet -->
<div id="sheet" class="fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 hidden">
  <div class="bg-surface-container-lowest w-full max-w-md max-h-[85vh] rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
    <div class="p-space-md bg-surface-container-low flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary text-[22px]">science</span><div class="flex flex-col"><h3 class="font-title-md text-title-md">Formula Sheet</h3><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">Key equations from all 9 lectures</span></div></div>
    <button onclick="sheet.classList.add('hidden')" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined text-[18px]">close</span></button></div>
    <div id="sheetBody" class="p-space-md flex flex-col gap-space-sm overflow-y-auto font-body-sm text-body-sm"></div>
    <div class="p-space-md bg-surface-container-low flex justify-end"><button onclick="sheet.classList.add('hidden')" class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-mono-sm text-label-mono-sm font-semibold">Return to Question</button></div>
  </div>
</div>
<script>
const { $, esc, pad, params, shell, toast, buildTest, saveScore, store } = ACE;
const key = params.get("id") || "s1";
const T = buildTest(key) || buildTest("s1");
const SEED = String(Date.now());
T.qs = T.qs.map(q => ACE.shuffleOpts(q, SEED));
const isSample = /^s\d$/.test(T.meta.id);
document.title = T.meta.title + " · ACE104";
shell({ nav: false, back: isSample ? "index.html" : `lecture.html?id=${T.meta.id}`, kicker: "Foundations of Measurement", title: "Active Assessment" });
const LEC = Object.fromEntries(LECTURES.map(l => [l.id, l]));
const n = T.qs.length;
let cur = 0, ans = Array(n).fill(null), flags = Array(n).fill(false), secs = T.meta.min * 60, finished = false, timer;
sheetBody.innerHTML = LECTURES.map(l => `<div class="bg-surface-container-low p-3 rounded-lg flex flex-col gap-1"><span class="font-label-mono-sm text-label-mono-sm text-secondary font-semibold uppercase">L${pad(l.no)} · ${esc(l.track)}</span><p class="font-label-mono-md text-label-mono-md">${esc(l.formula.eq)}</p><p class="text-on-surface-variant text-[12px]">${esc(l.formula.where)}</p></div>`).join("");

function intro() {
  const prev = (ACE.scores()[T.meta.id] || {});
  app.innerHTML = `<section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-3">
    <div class="flex items-center gap-1.5 flex-wrap"><span class="font-label-mono-sm text-label-mono-sm px-2 py-0.5 rounded-full bg-secondary-fixed/40 text-on-secondary-fixed-variant">${esc(T.meta.tag)}</span>${prev.best != null ? `<span class="font-label-mono-sm text-label-mono-sm px-2 py-0.5 rounded-full bg-surface-container text-secondary font-semibold">Best ${prev.best}%</span>` : ""}</div>
    <h2 class="font-headline-sm text-headline-sm">${esc(T.meta.title)}</h2>
    ${T.meta.desc ? `<p class="font-body-sm text-body-sm text-on-surface-variant">${esc(T.meta.desc)}</p>` : ""}
    <div class="grid grid-cols-3 gap-2 text-center font-label-mono-sm text-label-mono-sm">
      <div class="bg-surface-container-low p-2 rounded-lg"><span class="text-on-surface-variant block text-[10px]">Questions</span><span class="font-semibold">${n}</span></div>
      <div class="bg-surface-container-low p-2 rounded-lg"><span class="text-on-surface-variant block text-[10px]">Time</span><span class="font-semibold">${T.meta.min} min</span></div>
      <div class="bg-surface-container-low p-2 rounded-lg"><span class="text-on-surface-variant block text-[10px]">Lectures</span><span class="font-semibold">${new Set(T.qs.map(q => q.lec)).size}</span></div></div>
    <ul class="text-on-surface-variant font-body-sm text-body-sm space-y-1.5"><li class="flex gap-2"><span class="material-symbols-outlined text-secondary text-[16px]">check_circle</span>One mark per question, no negative marking.</li><li class="flex gap-2"><span class="material-symbols-outlined text-secondary text-[16px]">check_circle</span>Flag questions to revisit; jump with the navigator.</li><li class="flex gap-2"><span class="material-symbols-outlined text-secondary text-[16px]">check_circle</span>The test submits itself when the timer runs out. Explanations follow.</li></ul>
    <button id="start" class="w-full py-3 rounded-lg bg-primary text-on-primary font-title-md text-title-md flex items-center justify-center gap-2 shadow">Start Test<span class="material-symbols-outlined text-[20px]">play_arrow</span></button></section>`;
  $("#start").onclick = () => { timer = setInterval(tick, 1000); render(); };
}
function tick() { if (finished) return; secs--; const el = $("#timer"); if (el) el.textContent = `${pad(Math.floor(secs / 60))}:${pad(secs % 60)}`; if (secs <= 0) { toast("Time's up — submitting"); submit(); } }
function render() {
  const q = T.qs[cur], l = LEC[q.lec], answered = ans.filter(a => a !== null).length, prog = (answered / n * 100).toFixed(1);
  app.innerHTML = `
  <section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm">
    <div class="flex items-center justify-between"><div class="flex items-center gap-space-xs"><span class="font-label-mono-sm text-label-mono-sm text-secondary uppercase bg-secondary-fixed/30 px-2 py-0.5 rounded-full">Test In Progress</span><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant font-medium">Q ${cur + 1} of ${n}</span></div>
    <div class="flex items-center gap-1.5 bg-error-container/40 px-2.5 py-1 rounded-full text-error"><span class="material-symbols-outlined text-[16px] animate-pulse">timer</span><span id="timer" class="font-label-mono-md text-label-mono-md font-semibold text-on-error-container">${pad(Math.floor(secs / 60))}:${pad(secs % 60)}</span></div></div>
    <div class="w-full bg-surface-container h-2 rounded-full overflow-hidden"><div class="bg-secondary h-full rounded-full transition-all duration-300" style="width:${prog}%"></div></div>
    <div class="flex justify-between items-center text-on-surface-variant font-label-mono-sm text-label-mono-sm"><span>Completion: ${prog}%</span><span>Target pace: ${(T.meta.min / n).toFixed(1)} min/q</span></div>
  </section>
  <section class="flex items-center justify-between gap-space-sm">
    <div class="flex items-center gap-1.5 flex-wrap min-w-0"><span class="font-label-mono-sm text-label-mono-sm text-on-tertiary-container bg-tertiary-fixed/30 px-2 py-0.5 rounded-full">L${pad(l.no)} · ${esc(l.track)}</span><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant bg-surface-container-high px-2 py-0.5 rounded-full">${/[=×÷√]|\d\.\d/.test(q.q) ? "Numerical" : "Concept"}</span></div>
    <button onclick="sheet.classList.remove('hidden')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-lowest text-secondary shadow-sm hover:bg-surface-container-low flex-shrink-0"><span class="material-symbols-outlined text-[18px]">menu_book</span><span class="font-label-mono-sm text-label-mono-sm font-semibold">Formula Sheet</span></button>
  </section>
  <section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
    <div class="flex flex-col gap-space-xs"><div class="flex items-center justify-between"><span class="font-label-mono-sm text-label-mono-sm text-secondary font-semibold uppercase tracking-wider">Metrological Problem ${pad(cur + 1)}</span>
      <button id="flag" class="flex items-center gap-1 ${flags[cur] ? "text-error" : "text-on-surface-variant hover:text-on-surface"} p-1 rounded-lg"><span class="material-symbols-outlined text-[20px] ${flags[cur] ? "fill" : ""}">bookmark</span><span class="font-label-mono-sm text-label-mono-sm">${flags[cur] ? "Flagged" : "Flag Question"}</span></button></div>
      <p class="font-body-md text-body-md leading-relaxed">${esc(q.q)}</p></div>
    <div class="flex flex-col gap-2.5 pt-1">${q.o.map((o, i) => { const sel = ans[cur] === i; return `<button data-i="${i}" class="opt group flex items-center justify-between p-3 rounded-lg text-left transition-all ${sel ? "bg-secondary-fixed/20 shadow-sm" : "bg-surface-container-low hover:bg-surface-container"}">
      <div class="flex items-center gap-3"><span class="w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center ${sel ? "bg-secondary" : "bg-surface-container-highest"}"><span class="w-2 h-2 rounded-full ${sel ? "bg-on-secondary" : ""}"></span></span><span class="font-label-mono-sm text-label-mono-sm font-bold ${sel ? "text-secondary" : "text-on-surface-variant"}">${"ABCD"[i]}.</span><span class="font-body-md text-body-md ${sel ? "font-semibold" : ""}">${esc(o)}</span></div>
      ${sel ? `<span class="flex items-center gap-1 text-secondary font-label-mono-sm text-label-mono-sm"><span class="material-symbols-outlined text-[16px]">check_circle</span>Selected</span>` : ""}</button>`; }).join("")}</div>
  </section>
  <section class="flex items-center justify-between gap-space-sm">
    <button id="prev" ${cur ? "" : "disabled"} class="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-surface-container hover:bg-surface-container-high disabled:opacity-40 flex-1"><span class="material-symbols-outlined text-[18px]">arrow_back</span><span class="font-label-mono-md text-label-mono-md font-semibold">Previous</span></button>
    <button id="next" class="flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container shadow-sm flex-[1.4]"><span class="font-label-mono-md text-label-mono-md font-semibold">${cur === n - 1 ? "Review & Submit" : "Save & Next"}</span><span class="material-symbols-outlined text-[18px]">${cur === n - 1 ? "task_alt" : "arrow_forward"}</span></button>
  </section>
  <section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm">
    <div class="flex items-center justify-between"><div class="flex flex-col"><span class="font-title-md text-title-md">Question Navigator</span><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">${n} total items • click to jump</span></div>
      <button id="submit" class="font-label-mono-sm text-label-mono-sm px-3 py-1.5 rounded-lg bg-secondary text-on-secondary font-semibold">Submit</button></div>
    <div class="flex items-center justify-between flex-wrap gap-2 font-label-mono-sm text-label-mono-sm text-on-surface-variant bg-surface-container-low px-2.5 py-1.5 rounded-lg">
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-secondary"></span>Answered (${answered})</span><span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-secondary-container"></span>Current (Q${cur + 1})</span><span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-primary-fixed-dim"></span>Flagged (${flags.filter(Boolean).length})</span><span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></span>Pending (${n - answered})</span></div>
    <div class="grid grid-cols-6 sm:grid-cols-9 gap-2 pt-1">${T.qs.map((_, i) => `<button data-j="${i}" class="chip relative h-9 rounded-lg font-label-mono-sm text-label-mono-sm font-semibold flex items-center justify-center ${i === cur ? "bg-secondary-container text-on-secondary-container shadow-sm" : flags[i] ? "bg-primary-fixed-dim text-on-primary-fixed" : ans[i] !== null ? "bg-secondary text-on-secondary" : "bg-surface-container-highest text-on-surface-variant hover:bg-surface-variant"}">${pad(i + 1)}${flags[i] ? '<span class="w-1.5 h-1.5 rounded-full bg-error absolute top-1 right-1"></span>' : ""}</button>`).join("")}</div>
  </section>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[cur] = +b.dataset.i; toast(`Option ${"ABCD"[ans[cur]]} marked`); render(); });
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = +b.dataset.j; render(); });
  $("#flag").onclick = () => { flags[cur] = !flags[cur]; toast(flags[cur] ? `Question ${cur + 1} flagged for review` : "Flag removed"); render(); };
  $("#prev").onclick = () => { cur--; render(); };
  $("#next").onclick = () => { if (cur < n - 1) { cur++; render(); window.scrollTo({ top: 0 }); } else confirmSubmit(); };
  $("#submit").onclick = confirmSubmit;
}
function confirmSubmit() { const left = ans.filter(a => a === null).length; if (left && !confirmBox(left)) return; submit(); }
function confirmBox(left) { return window.confirm(`${left} question(s) unanswered. Submit anyway?`); }
function submit() {
  finished = true; clearInterval(timer);
  const correct = T.qs.reduce((c, q, i) => c + (ans[i] === q.a ? 1 : 0), 0), pct = Math.round(correct / n * 100);
  saveScore(T.meta.id, pct);
  const by = {}; T.qs.forEach((q, i) => { const b = by[q.lec] = by[q.lec] || [0, 0]; b[1]++; if (ans[i] === q.a) b[0]++; });
  const used = T.meta.min * 60 - Math.max(secs, 0);
  app.innerHTML = `
  <section class="bg-primary-container text-on-primary rounded-xl p-space-md shadow-md relative overflow-hidden">
    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-secondary rounded-full blur-2xl opacity-30"></div>
    <span class="font-label-mono-sm text-label-mono-sm uppercase text-secondary-fixed">Result · ${esc(T.meta.tag)}</span>
    <div class="flex items-end gap-3 mt-1"><span class="font-display-lg-mobile text-display-lg-mobile text-surface-bright">${pct}%</span><span class="font-body-sm text-body-sm text-primary-fixed-dim mb-1.5">${correct} / ${n} correct · ${pad(Math.floor(used / 60))}:${pad(used % 60)} used</span></div>
    <p class="font-body-sm text-body-sm text-primary-fixed-dim mt-1">${pct >= 85 ? "Excellent — compre ready." : pct >= 60 ? "Good. Review the misses below." : "Revisit the lecture notes and try again."}</p>
    <div class="flex gap-2 mt-3 relative z-10"><a href="test.html?id=${T.meta.id}" class="px-3 py-2 rounded-lg bg-secondary text-on-secondary font-label-mono-sm text-label-mono-sm font-semibold flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">replay</span>Retake</a><a href="${isSample ? "practice.html" : "lecture.html?id=" + T.meta.id}" class="px-3 py-2 rounded-lg bg-surface-container-lowest/15 text-surface-bright font-label-mono-sm text-label-mono-sm font-semibold">${isSample ? "All tests" : "Back to lecture"}</a></div>
  </section>
  ${isSample ? `<section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm"><h3 class="font-title-md text-title-md mb-2">By lecture</h3><div class="flex flex-col gap-2">${LECTURES.filter(l => by[l.id]).map(l => { const [c, t] = by[l.id]; return `<a href="lecture.html?id=${l.id}" class="flex items-center gap-3"><span class="font-label-mono-sm text-label-mono-sm w-28 truncate">L${pad(l.no)} ${esc(l.track)}</span><div class="flex-1 bg-surface-container h-2 rounded-full overflow-hidden"><div class="h-full rounded-full ${c / t >= 0.67 ? "bg-secondary" : "bg-error"}" style="width:${c / t * 100}%"></div></div><span class="font-label-mono-sm text-label-mono-sm w-8 text-right">${c}/${t}</span></a>`; }).join("")}</div></section>` : ""}
  <section class="flex flex-col gap-space-sm"><h3 class="font-title-md text-title-md">Review</h3>${T.qs.map((q, i) => { const ok = ans[i] === q.a; return `<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-2">
    <div class="flex items-center justify-between"><span class="font-label-mono-sm text-label-mono-sm text-secondary">Q${pad(i + 1)} · L${pad(LEC[q.lec].no)} ${esc(LEC[q.lec].track)}</span><span class="font-label-mono-sm text-label-mono-sm px-2 py-0.5 rounded-full ${ok ? "bg-secondary-fixed/40 text-on-secondary-fixed-variant" : ans[i] === null ? "bg-surface-container text-on-surface-variant" : "bg-error-container text-on-error-container"}">${ok ? "Correct" : ans[i] === null ? "Skipped" : "Incorrect"}</span></div>
    <p class="font-body-sm text-body-sm font-medium">${esc(q.q)}</p>
    <div class="flex flex-col gap-1">${q.o.map((o, j) => `<div class="font-body-sm text-body-sm px-2.5 py-1.5 rounded-lg ${j === q.a ? "bg-secondary-fixed/30 text-on-secondary-fixed-variant font-semibold" : j === ans[i] ? "bg-error-container/60 text-on-error-container line-through" : "text-on-surface-variant"}">${"ABCD"[j]}. ${esc(o)}</div>`).join("")}</div>
    <p class="font-body-sm text-body-sm text-on-surface-variant bg-surface-container-low rounded-lg p-2.5"><span class="material-symbols-outlined text-secondary text-[15px] align-[-3px]">lightbulb</span> ${esc(q.e)}</p></div>`; }).join("")}</section>`;
  window.scrollTo({ top: 0 });
}
intro();
</script>
</body></html>
