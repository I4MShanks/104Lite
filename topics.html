<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>

<style>html,body{margin:0}body{overscroll-behavior:none;font-family:Inter,system-ui,sans-serif}::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400;line-height:1}.fill{font-variation-settings:'FILL' 1}@media print{header,nav,.noprint{display:none!important}main{padding:0!important}}</style>

</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<main class="max-w-3xl mx-auto pt-16 pb-28 px-gutter-mobile">
<section class="pt-space-md"><h2 class="font-headline-sm text-headline-sm">Topics</h2><p class="font-body-sm text-body-sm text-on-surface-variant">Lecture 1 plus the eight experiments — 3 quizzes each (10 Qs · 15 min · +3/−1).</p></section>
<div id="list" class="stagger grid sm:grid-cols-2 gap-space-sm mt-space-md"></div>
</main>
<script>
const { shell, results, topicQuizzes, esc } = ACE;
shell({ active: "topics", title: "Topics" });
const R = results();
list.innerHTML = TOPICS.map(t => { const qz = topicQuizzes(t.id), done = qz.filter(q => R[q.id]), best = done.map(q => R[q.id].best), avg = best.length ? Math.round(best.reduce((a, b) => a + Math.max(0, b), 0) / best.length / 30 * 100) : null;
  return `<a href="topic.html?id=${t.id}" class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm hover:shadow-md flex flex-col gap-3">
  <div class="flex items-center gap-3"><span class="w-11 h-11 rounded-lg bg-surface-container-high text-secondary flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-[24px]">${t.icon}</span></span>
  <div class="min-w-0"><p class="font-label-mono-sm text-label-mono-sm text-secondary">${t.code} · ${esc(t.dept)}</p><h3 class="font-title-md text-title-md leading-snug">${esc(t.name)}</h3></div></div>
  <p class="font-body-sm text-body-sm text-on-surface-variant">${esc(t.sub)}</p>
  <div class="flex items-center gap-2"><div class="flex-1 bg-surface-container h-1.5 rounded-full overflow-hidden"><div class="h-full bg-secondary rounded-full" style="width:${avg || 0}%"></div></div><span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">${done.length}/3 done${avg != null ? " · " + avg + "%" : ""}</span></div></a>`; }).join("");
</script>
</body></html>
